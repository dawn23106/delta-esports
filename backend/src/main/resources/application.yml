server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:120}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:2048}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:10s}
    keep-alive-timeout: ${TOMCAT_KEEP_ALIVE_TIMEOUT:20s}
    max-keep-alive-requests: ${TOMCAT_MAX_KEEP_ALIVE_REQUESTS:100}

spring:
  application:
    name: delta-esports
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:2}
      thread-name-prefix: delta-scheduling-
      shutdown:
        await-termination: true
        await-termination-period: 20s
  profiles:
    active: dev

---
# H2 开发环境
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:delta_esports;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 1000ms

app:
  rate-limit:
    redis-enabled: ${RATE_LIMIT_REDIS_ENABLED:false}
  order-timeout:
    minutes: ${ORDER_TIMEOUT_MINUTES:30}
    scan-ms: ${ORDER_TIMEOUT_SCAN_MS:60000}
    initial-delay-ms: ${ORDER_TIMEOUT_INITIAL_DELAY_MS:60000}
  commission:
    rate: ${COMMISSION_RATE:0.15}
  withdrawal:
    lock-days: ${WITHDRAWAL_LOCK_DAYS:7}
  redis:
    pubsub:
      enabled: ${REDIS_PUBSUB_ENABLED:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: ${DB_STATEMENT_TIMEOUT_SECONDS:10}
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:delta-esports-dev-secret-key-min-32-chars}
  expiration: 86400000
  refresh-expiration: 604800000

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.delta.esports: debug

payment:
  enabled: ${PAYMENT_ENABLED:false}
  mock-enabled: ${PAYMENT_MOCK_ENABLED:true}
  provider: ${PAYMENT_PROVIDER:yungouos}
  api-base-url: ${PAYMENT_API_BASE_URL:https://api.pay.yungouos.com}
  merchant-id: ${PAYMENT_MERCHANT_ID:}
  api-key: ${PAYMENT_API_KEY:}
  app-id: ${WECHAT_MINIPROGRAM_APP_ID:}
  app-secret: ${WECHAT_MINIPROGRAM_APP_SECRET:}
  pay-notify-url: ${PAYMENT_PAY_NOTIFY_URL:}
  refund-notify-url: ${PAYMENT_REFUND_NOTIFY_URL:}
  connect-timeout-ms: 5000
  read-timeout-ms: 10000

---
# MySQL 生产环境
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/delta_esports?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      pool-name: DeltaHikariPool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD_MS:0}
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 1000ms

app:
  rate-limit:
    redis-enabled: ${RATE_LIMIT_REDIS_ENABLED:true}
  order-timeout:
    minutes: ${ORDER_TIMEOUT_MINUTES:30}
    scan-ms: ${ORDER_TIMEOUT_SCAN_MS:60000}
    initial-delay-ms: ${ORDER_TIMEOUT_INITIAL_DELAY_MS:60000}
  commission:
    rate: ${COMMISSION_RATE:0.15}
  withdrawal:
    lock-days: ${WITHDRAWAL_LOCK_DAYS:7}
  redis:
    pubsub:
      enabled: ${REDIS_PUBSUB_ENABLED:true}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: ${DB_STATEMENT_TIMEOUT_SECONDS:5}
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

cors:
  allowed-origins: ${CORS_ORIGINS}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

payment:
  enabled: ${PAYMENT_ENABLED:false}
  mock-enabled: false
  provider: ${PAYMENT_PROVIDER:yungouos}
  api-base-url: ${PAYMENT_API_BASE_URL:https://api.pay.yungouos.com}
  merchant-id: ${PAYMENT_MERCHANT_ID:}
  api-key: ${PAYMENT_API_KEY:}
  app-id: ${WECHAT_MINIPROGRAM_APP_ID:}
  app-secret: ${WECHAT_MINIPROGRAM_APP_SECRET:}
  pay-notify-url: ${PAYMENT_PAY_NOTIFY_URL:}
  refund-notify-url: ${PAYMENT_REFUND_NOTIFY_URL:}
  connect-timeout-ms: 5000
  read-timeout-ms: 10000
