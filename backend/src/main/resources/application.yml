server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: delta-esports
  lifecycle:
    timeout-per-shutdown-phase: 20s
  profiles:
    active: dev

---
# H2 开发环境
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:delta_esports;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 1000ms

app:
  rate-limit:
    redis-enabled: ${RATE_LIMIT_REDIS_ENABLED:false}
  order-timeout:
    minutes: ${ORDER_TIMEOUT_MINUTES:30}
    scan-ms: ${ORDER_TIMEOUT_SCAN_MS:60000}
    initial-delay-ms: ${ORDER_TIMEOUT_INITIAL_DELAY_MS:60000}
  commission:
    rate: ${COMMISSION_RATE:0.15}
  withdrawal:
    lock-days: ${WITHDRAWAL_LOCK_DAYS:7}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:delta-esports-dev-secret-key-min-32-chars}
  expiration: 86400000
  refresh-expiration: 604800000

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.delta.esports: debug

payment:
  enabled: ${PAYMENT_ENABLED:false}
  mock-enabled: ${PAYMENT_MOCK_ENABLED:true}
  provider: ${PAYMENT_PROVIDER:yungouos}
  api-base-url: ${PAYMENT_API_BASE_URL:https://api.pay.yungouos.com}
  merchant-id: ${PAYMENT_MERCHANT_ID:}
  api-key: ${PAYMENT_API_KEY:}
  app-id: ${WECHAT_MINIPROGRAM_APP_ID:}
  app-secret: ${WECHAT_MINIPROGRAM_APP_SECRET:}
  pay-notify-url: ${PAYMENT_PAY_NOTIFY_URL:}
  refund-notify-url: ${PAYMENT_REFUND_NOTIFY_URL:}
  connect-timeout-ms: 5000
  read-timeout-ms: 10000

---
# MySQL 生产环境
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/delta_esports?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 1000ms

app:
  rate-limit:
    redis-enabled: ${RATE_LIMIT_REDIS_ENABLED:true}
  order-timeout:
    minutes: ${ORDER_TIMEOUT_MINUTES:30}
    scan-ms: ${ORDER_TIMEOUT_SCAN_MS:60000}
    initial-delay-ms: ${ORDER_TIMEOUT_INITIAL_DELAY_MS:60000}
  commission:
    rate: ${COMMISSION_RATE:0.15}
  withdrawal:
    lock-days: ${WITHDRAWAL_LOCK_DAYS:7}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

cors:
  allowed-origins: ${CORS_ORIGINS}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

payment:
  enabled: ${PAYMENT_ENABLED:false}
  mock-enabled: false
  provider: ${PAYMENT_PROVIDER:yungouos}
  api-base-url: ${PAYMENT_API_BASE_URL:https://api.pay.yungouos.com}
  merchant-id: ${PAYMENT_MERCHANT_ID:}
  api-key: ${PAYMENT_API_KEY:}
  app-id: ${WECHAT_MINIPROGRAM_APP_ID:}
  app-secret: ${WECHAT_MINIPROGRAM_APP_SECRET:}
  pay-notify-url: ${PAYMENT_PAY_NOTIFY_URL:}
  refund-notify-url: ${PAYMENT_REFUND_NOTIFY_URL:}
  connect-timeout-ms: 5000
  read-timeout-ms: 10000
